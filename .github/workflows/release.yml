name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build Windows archive
        shell: pwsh
        run: ./build.ps1 -Zip -Version $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/GitHubFolderSync-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Build Linux archive
        run: bash ./build.sh "$GITHUB_REF_NAME"
      - name: Smoke-test packaged application
        run: |
          test_dir=$(mktemp -d)
          trap 'rm -rf -- "$test_dir"' EXIT
          tar -xzf "dist/GitHubFolderSync-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C "$test_dir"
          status=0
          xvfb-run -a timeout 10s "$test_dir/GitHubFolderSync/GitHubFolderSync" || status=$?
          if [[ "$status" != 124 ]]; then
            echo "Expected the GUI to stay open until timeout, got status $status"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/GitHubFolderSync-${{ github.ref_name }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/GitHubFolderSync-${GITHUB_REF_NAME}-windows-x64.zip" \
            "dist/GitHubFolderSync-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            --verify-tag --generate-notes
